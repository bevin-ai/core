# Dev stack: source is bind-mounted, hot-reload runs in containers.
# Usage: docker compose up
# First run builds the images; later runs never need --build
# (rebuild only after adding dependencies).

services:
  client:
    build: ./client # image CMD runs `npm run dev`
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules # container's linux deps stay; host mount can't hide them
    environment:
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - server

  server:
    build: ./server
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npx nodemon --legacy-watch --exec tsx index.ts"
    ports:
      - "5000:5000"
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/bevin?schema=public
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bevin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bevin"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
