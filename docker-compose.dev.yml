# Dev overlay: source is bind-mounted, hot-reload runs in containers.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# First run builds the images; later runs never need --build
# (rebuild only after adding npm dependencies).

services:
  client:
    build:
      context: ./client
      target: build # keep the node stage with deps, skip the nginx image
    command: npm run dev -- --host 0.0.0.0 --port 5173
    volumes:
      - ./client:/app
      - /app/node_modules # container's linux deps stay; host mount can't hide them
    environment:
      CHOKIDAR_USEPOLLING: "true"

  server:
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npx nodemon --legacy-watch --exec tsx index.ts"
    volumes:
      - ./server:/app
      - /app/node_modules
