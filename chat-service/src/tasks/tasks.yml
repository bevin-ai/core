analyze_code_inquiry:
  description: >-
    Analyze the developer question or programming requirement: {topic}.
    Identify core challenges, technical requirements, and suggest an optimal solution
    with clear, modular code snippets where relevant.
  expected_output: >-
    A well-structured technical analysis outlining the approach, step-by-step
    breakdown, and code implementation.
  agent: code_analyst

review_code_solution:
  description: >-
    Review the analysis and implementation provided for: {topic}.
    Check for potential bugs, security or performance concerns, and adherence
    to clean coding standards. Refine the explanation to be clear and developer-friendly.
  expected_output: >-
    A polished, production-ready final response combining the reviewed solution,
    actionable best practices, and verified code recommendations.
  agent: solution_reviewer
